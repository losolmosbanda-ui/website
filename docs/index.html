<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los Olmos - Home</title>
  <style>

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    @font-face {
      font-family: "home";
      src: url("fonts/home.ttf") format("opentype");
    }

    body {
      font-family: "home", sans-serif;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #000;
    }

    body.home-page{
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: url("images/TV.gif");
      background-attachment: fixed;
    }

    .image-container {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-container {
      position: absolute;
      top: 5vw;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0px; 
      padding-right: 1.8vw;
    }

    .nav-arrow {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0px;
      width: 55%; 
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .nav-arrow img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      transition: transform 0.2s ease;
    }

    .nav-arrow--Eventos {
      transform:translateY(-.4vw);
    }

    .nav-arrow:hover img {
      transform: scale(1.25);
    }

    .nav-arrow--Archivo {
      transform:translateY(-2.4vw);
    }

    .nav-arrow--Presskit {
      transform:translateY(-2vw);
    }

    .nav-arrow--Olmoshop {
      transform:translateY(-3.5vw);
    }

    footer {
      background: rgba(0,0,0,0.6);
      text-align: center;
      font-size: 0.9rem;
      padding: 1rem;
      margin-top: auto; 
    }

  </style>
</head>

<body class="home-page">

  <div class="image-container">
    <img src="images/tv_colores.png" alt="TV" />

    <div class="nav-container">
      <a class="nav-arrow nav-arrow--Eventos" href="Eventos.html" aria-label="Eventos">
        <img src="images/600ppi/Eventos.png" alt="Eventos">
      </a>

      <a class="nav-arrow nav-arrow--Archivo" href="Archivo.html" aria-label="Archivo">
        <img src="images/600ppi/Archivo.png" alt="Archivo">
      </a>

      <a class="nav-arrow nav-arrow--Presskit" href="Presskit.html" aria-label="Presskit">
        <img src="images/600ppi/Presskit.png" alt="Presskit">
      </a >

      <a class="nav-arrow nav-arrow--Olmoshop" href="https://losolmos.bandcamp.com/track/santa-teresa" aria-label="Olmoshop">
        <img src="images/600ppi/Olmoshop.png" alt="Olmoshop">
      </a>
    </div>

  </div>

  <footer>
    &copy; 2026 Los Olmos LLC. Todos los derechos reservados.
  </footer>

</body>
</html>
